---
# Dienste, die vor dem Patchen gestoppt und danach wieder gestartet werden.
# Dienste, die auf einem Host nicht existieren, werden uebersprungen.
# Fuer einzelne Gruppen ueberschreibbar, z.B. in group_vars/windows_ad.yml
windows_patch_services:
  - Spooler
  - CogonCalculationService
  - CogonCommonService
  - CogonCommunicationService
  - CogonMonitoringProcess
  - CogonPathMonitoringService
  - CogonReportingService
  - CogonServiceManager
  - CogonShadowAccountingService
  - glpi-agent

# vCenter fuer die Snapshots vor dem Patchen
vcenter_hostname: vcenter1.gutingia.local
datacenter_name: myLife

# Schwellwert der Plattenplatz-Pruefung nach dem Patchen, in GB
windows_min_diskspace_gb: 16

# Ohne Snapshot wird nicht gepatcht. Fuer Hosts ohne VM in diesem vCenter
# (physische Maschinen, Fremd-vCenter) pro Gruppe auf false setzen, z.B. in
# inventory/group_vars/windows_notdomain.yml
snapshot_required: true
