---
# Kleiner Testlauf fuer Semaphore (Template "myPatchTest").
#
# Zweck: pruefen, ob Repository, Inventory, SSH-Key und sudo stimmen - ohne
# dass auf den Zielhosts irgendetwas veraendert wird. Standardmaessig laeuft
# nur eine Simulation (apt_dry_run: true); erst mit
#   Extra-Var  apt_dry_run=false
# wird wirklich installiert.
#
# 'localhost' ist unter Semaphore der Task-Container, nicht der Controller -
# deshalb laeuft dieses Playbook ausschliesslich gegen Inventory-Hosts.

- name: Test - APT Update
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  vars:
    apt_dry_run: true
    # Immer mit "| bool" auswerten: per -e oder Survey kommt der Wert als Text
    # an, und der Text "false" ist fuer Ansible wahr.

  tasks:
    - name: Nur Debian/Ubuntu behandeln
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          {{ inventory_hostname }} ist kein Debian/Ubuntu
          (os_family={{ ansible_facts['os_family'] }}) - APT passt hier nicht.
        quiet: true

    - name: Verbindung und System melden
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}) erreicht,
          become-User ist {{ ansible_facts['user_id'] }}

    - name: Paketlisten aktualisieren
      ansible.builtin.apt:
        update_cache: true

    - name: Anstehende Updates ermitteln (installiert nichts)
      ansible.builtin.apt:
        upgrade: dist
      check_mode: true
      register: apt_simulation

    - name: Anstehende Updates anzeigen
      ansible.builtin.debug:
        msg: >-
          {{ apt_simulation.changed | ternary('Es stehen Updates an.',
             'Keine Updates offen - System ist aktuell.') }}

    - name: Upgrade durchfuehren
      ansible.builtin.apt:
        upgrade: dist
      when: not (apt_dry_run | bool)

    - name: Pruefen, ob ein Reboot noetig waere
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Ergebnis zusammenfassen
      ansible.builtin.debug:
        msg: >-
          Modus: {{ (apt_dry_run | bool) | ternary('Simulation (nichts geaendert)',
          'Upgrade ausgefuehrt') }} |
          Reboot noetig: {{ reboot_required_file.stat.exists | ternary('ja', 'nein') }}
          {{ (apt_dry_run | bool) | ternary('(Dieser Testlauf rebootet grundsaetzlich nicht.)', '') }}
