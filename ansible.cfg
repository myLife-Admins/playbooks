[defaults]
inventory = inventory/hosts
interpreter_python = auto_silent

# --- Ausgabe / Fortschritt --------------------------------------------------
# Task-Ergebnisse als YAML statt als einzeiliges JSON. Ersetzt den frueheren
# community.general.yaml-Callback, den es in aktuellen Versionen nicht mehr
# gibt - ansible-core kann das seit 2.13 selbst.
callback_result_format = yaml

# Uebersprungene Tasks nicht ausgeben. Durch die when-Bedingungen (Resume,
# snapshot_required) entsteht sonst viel Rauschen. Auf True setzen, wenn
# nachvollzogen werden soll, warum ein Host etwas ausgelassen hat.
display_skipped_hosts = False

# profile_tasks schreibt Startzeit und Dauer pro Task und am Ende eine Liste
# der langsamsten - damit sieht man im Semaphore-Log, wo ein Lauf gerade steht
# und wie lange er dort schon haengt. timer ergaenzt die Gesamtlaufzeit.
# Beide sind aggregate-Callbacks und laufen neben dem stdout-Callback.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer

# Default sind 5 parallele Hosts - kleiner als die meisten Patchgruppen.
# Die Snapshots sind separat per throttle: 2 gedrosselt.
forks = 10
