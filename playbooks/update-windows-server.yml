---
# Fehlerstrategie
# ---------------
# Ziel: es wird IMMER ein Protokoll geschrieben, auch wenn der Lauf scheitert.
# Das leistet der always-Block am Ende - dafuer braucht es kein ignore_errors.
# Frueher stand ignore_errors auf fast jedem Task; damit erreichte nie ein
# Fehler den rescue-Block, patch_error blieb leer und das Protokoll meldete
# "OK", obwohl das Update fehlgeschlagen war.
#
# Jetzt gilt:
#   - Kritischer Pfad (Snapshot, Updates, Reboot): kein ignore_errors.
#     Ein Fehler springt nach rescue, wird festgehalten und steht im Protokoll.
#   - Diagnose-Tasks (Versionen, Plattenplatz): failed_when: false.
#     Die duerfen scheitern, ohne den Patchlauf zu kippen - ihr Ergebnis wird
#     als "(nicht ermittelt)" protokolliert.
#   - Dienste werden im always-Block gestartet, nicht am Ende des block-Teils:
#     sonst bleiben sie nach einem Abbruch dauerhaft gestoppt.
- name: Patch Windows Host
  hosts: "{{ target_hosts }}"
  become: false
  gather_facts: true

  # strategy: free laesst jeden Host unabhaengig durchlaufen - schnell, aber
  # die Ausgabe mehrerer Hosts verschraenkt sich und ist kaum noch zu lesen.
  # Ohne diese Zeile (strategy: linear, der Standard) laeuft Ansible Task fuer
  # Task durch und gibt pro Task einen Block mit allen Hosts aus: deutlich
  # besser nachvollziehbar, dafuer wartet nach jedem Task der schnellste Host
  # auf den langsamsten.
  strategy: free

  tasks:

  # Unter Semaphore kommen die Credentials nicht mehr aus vars_prompt:
  # ansible_user/ansible_password haengen am Inventory (Key Store),
  # vm_user/vm_password kommen aus einer Variable Group bzw. -e.
  # Frueh und mit klarer Meldung abbrechen, statt spaeter im Snapshot.
  - name: Verify required credentials are set
    ansible.builtin.assert:
      that:
        - ansible_user is defined and ansible_user | length > 0
        - ansible_password is defined and ansible_password | length > 0
        - vm_user is defined and vm_user | length > 0
        - vm_password is defined and vm_password | length > 0
      fail_msg: >-
        Zugangsdaten fehlen. ansible_user/ansible_password gehoeren an das
        Semaphore-Inventory, vm_user/vm_password in die Variable Group.
      quiet: true

  - name: Set groupname
    set_fact:
      groupe_name: "{{ (target_hosts.split('_')[1] if '_' in target_hosts else inventory_hostname) }}"

  - name: Get current year and month
    set_fact:
      current_year: "{{ ansible_facts['date_time']['year'] }}"
      current_month: "{{ '%02d'|format(ansible_facts['date_time']['month']|int) }}"
      current_time: "{{ ansible_facts['date_time']['iso8601'] }}"
    delegate_to: localhost

  - name: Create directories for current year and month
    file:
      path: "{{ protokoll_basis }}/{{ current_year }}/{{ current_month }}"
      state: directory
    delegate_to: localhost

  - name: Ensure resume state directory exists
    file:
      path: "{{ resume_state_dir }}"
      state: directory
    delegate_to: localhost

  # Resume-State: Pro Host wird ein Marker abgelegt, damit ein
  # fehlgeschlagener Lauf (nach Fehlerbehebung) ohne erneuten Snapshot
  # fortgesetzt werden kann. Marker wird bei Erfolg automatisch geloescht.
  - name: Check for resume state file
    stat:
      path: "{{ resume_state_dir }}/patch_resume_{{ inventory_hostname }}.txt"
    register: resume_state_file
    delegate_to: localhost

  - name: Load resume state
    set_fact:
      resume_from: "{{ lookup('file', resume_state_dir + '/patch_resume_' + inventory_hostname + '.txt') | trim }}"
    when: resume_state_file.stat.exists

  - name: Set initial state
    set_fact:
      resume_from: "start"
    when: not resume_state_file.stat.exists

  # Standardwerte, damit das Protokoll auch bei sehr fruehen Fehlern
  # vollstaendig geschrieben werden kann.
  - name: Initialize defaults for log safety
    set_fact:
      patch_error: ""
      snapshot_status: "nicht ausgefuehrt"
      service_info:
        results: []
      update_result:
        found_update_count: 0
        updates: {}
        reboot_required: false
      initial_version:
        stdout_lines: ["unbekannt"]
      patched_version:
        stdout_lines: ["unbekannt"]
      windows_verson_check: "ToDo: Versionsupdate = (nicht ermittelt)"
      windows_diskspace_check: "ToDo: Festplattenspeicher = (nicht ermittelt)"
      reboot_start:
        stdout: "unbekannt"
      reboot_end:
        stdout: "unbekannt"

  - block:

      # --- Snapshot ---------------------------------------------------------
      # Ohne Rollback-Punkt wird nicht gepatcht. Frueher lief der Patch auch
      # dann weiter, wenn vCenter nicht erreichbar war oder die VM nicht
      # gefunden wurde - das Protokoll erwaehnte das mit keinem Wort.
      # Fuer Hosts ohne vCenter-VM (physisch) snapshot_required: false setzen,
      # z.B. in inventory/group_vars/windows_notdomain.yml
      - name: Gather VM details
        vmware.vmware.vm_info:
          hostname: "{{ vcenter_hostname }}"
          username: "{{ vm_user }}"
          password: "{{ vm_password }}"
          validate_certs: no
          datacenter: "{{ datacenter_name }}"
          folder: "/{{ datacenter_name }}/vm/"
          name: "{{ inventory_hostname }}"
        register: vm_info
        delegate_to: localhost
        failed_when: false
        when: resume_from == 'start'

      - name: Fail if VM was not found and a snapshot is required
        fail:
          msg: >-
            VM '{{ inventory_hostname }}' wurde in vCenter {{ vcenter_hostname }}
            nicht gefunden ({{ vm_info.msg | default('kein Grund gemeldet') }}).
            Ohne Snapshot wird nicht gepatcht. Physische Hosts oder VMs ausserhalb
            dieses vCenters brauchen snapshot_required: false.
        when:
          - resume_from == 'start'
          - snapshot_required | default(true) | bool
          - vm_info.instance is not defined

      - name: Create Snapshots
        vmware.vmware.vm_snapshot:
          hostname: "{{ vcenter_hostname }}"
          username: "{{ vm_user }}"
          password: "{{ vm_password }}"
          validate_certs: no
          datacenter: "{{ datacenter_name }}"
          folder: "/{{ datacenter_name }}/vm/"
          name: "{{ inventory_hostname }}"
          state: present
          memory_dump: yes
          snapshot_name: "Windows_Update-{{ ansible_facts['date_time']['date'] }}"
          description: >
            "Dieser Snapshot wurde automatisch von Ansible am {{ ansible_facts['date_time']['date'] }} um {{ ansible_facts['date_time']['time'] }}
            vor der Durchführung von Systemupdates generiert. Dies dient der Sicherung des aktuellen Systemzustands,
            um bei Bedarf eine Wiederherstellung auf diesen Punkt zu ermöglichen."
        throttle: 2
        delegate_to: localhost
        register: snapshot_result
        when:
          - resume_from == 'start'
          - vm_info.instance is defined

      - name: Record snapshot status
        set_fact:
          snapshot_status: >-
            {{ 'erstellt' if (snapshot_result is defined and snapshot_result is not skipped)
               else ('uebersprungen (Resume nach ' + resume_from + ')' if resume_from != 'start'
               else 'uebersprungen (snapshot_required=false)') }}

      # Marker erst schreiben, wenn der Snapshot wirklich durch ist. Frueher
      # wurde er unbedingt gesetzt: schlug der Snapshot fehl, meldete der
      # naechste Lauf "snapshot_done" und patchte ohne Rollback-Punkt.
      - name: Save resume checkpoint after snapshot
        copy:
          content: "snapshot_done"
          dest: "{{ resume_state_dir }}/patch_resume_{{ inventory_hostname }}.txt"
        delegate_to: localhost
        when: resume_from == 'start'

      # --- Dienste stoppen --------------------------------------------------
      - include_tasks: tasks/windows/get-services.yml

      - include_tasks: tasks/windows/stop-services.yml

      # --- Updates ----------------------------------------------------------
      - name: Get windows version before
        ansible.windows.win_shell: |
          (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild +'.'+ (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR
        register: initial_version
        failed_when: false

      - name: Get reboot started time
        shell: "date +%Y-%m-%d_%H:%M:%S"
        register: reboot_start
        delegate_to: localhost

      - name: Install updates
        ansible.windows.win_updates:
          category_names:
          - CriticalUpdates
          - SecurityUpdates
          - UpdateRollups
          - Updates
          - FeaturePacks
          - ServicePacks
          - DefinitionUpdates
          - Tools
          - Guidance
          - UpdateRollup
          state: installed
        register: update_result

      - name: Check if reboot is required
        win_reboot:
          reboot_timeout: 1800
        when: update_result.reboot_required

      # --- Kontrollen -------------------------------------------------------
      - name: Get windows version after
        ansible.windows.win_shell: |
          (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild +'.'+ (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR
        register: patched_version
        failed_when: false

      - name: Compare windows versions = OK
        set_fact:
          windows_verson_check: "ToDo: Versionsupdate von {{ initial_version.stdout_lines }} zu {{ patched_version.stdout_lines }} =  OK"
        when: initial_version.stdout_lines != patched_version.stdout_lines

      - name: Compare windows versions = NO UPDATES
        set_fact:
          windows_verson_check: "ToDo: Versionsupdate von {{ initial_version.stdout_lines }} zu {{ patched_version.stdout_lines }} =  KEIN UPDATE"
        when:
          - initial_version.stdout_lines == patched_version.stdout_lines
          - update_result.found_update_count | default(0) == 0

      - name: Compare windows versions = FAILED
        set_fact:
          windows_verson_check: "ToDo: Versionsupdate von {{ initial_version.stdout_lines }} zu {{ patched_version.stdout_lines }} =  FAILED!"
        when:
          - initial_version.stdout_lines == patched_version.stdout_lines
          - update_result.found_update_count | default(0) > 0

      - name: Get reboot finished time
        shell: "date +%Y-%m-%d_%H:%M:%S"
        register: reboot_end
        delegate_to: localhost

      - name: Get free diskspace
        ansible.windows.win_powershell:
          script: |
            "{0:N2}" -f (Get-PSDrive C | Select-Object Free | ForEach-Object { $_.Free / 1GB })
        register: disk_space
        failed_when: false

      # Nur auswerten, wenn der Task auch etwas geliefert hat - sonst kippte
      # dieses set_fact mit "undefined" in den rescue-Block und verschleierte
      # die eigentliche Fehlerursache.
      - name: Set disk space check result
        set_fact:
          disk_space_gb: "{{ disk_space.output[0] | replace(',', '.') | float }}"
          windows_diskspace_check: >-
            {% if (disk_space.output[0] | replace(',', '.') | float) < (windows_min_diskspace_gb | float) %}
            ToDo: Festplattenspeicher {{ disk_space.output[0] | replace(',', '.') | float }} GB = ERROR
            {% else %}
            ToDo: Festplattenspeicher {{ disk_space.output[0] | replace(',', '.') | float }} GB = OK
            {% endif %}
        when: disk_space.output | default([]) | length > 0

      - name: Clear resume state on success
        file:
          path: "{{ resume_state_dir }}/patch_resume_{{ inventory_hostname }}.txt"
          state: absent
        delegate_to: localhost

    rescue:
      - name: Capture error info
        set_fact:
          patch_error: "FEHLER in Task '{{ ansible_failed_task.name }}': {{ ansible_failed_result.msg | default('unbekannter Fehler') }}"

    always:
      # Dienste gehoeren in den always-Block: bricht der Lauf nach dem Stoppen
      # ab, blieben sie sonst dauerhaft gestoppt zurueck.
      - include_tasks: tasks/windows/start-services.yml

      - include_tasks: tasks/windows/write-patchlog.yml
