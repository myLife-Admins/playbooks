- name: Get current year and month
  set_fact:
    current_year: "{{ ansible_facts['date_time']['year'] }}"
    current_month: "{{ '%02d'|format(ansible_facts['date_time']['month']|int) }}"
    current_time: "{{ ansible_facts['date_time']['iso8601'] }}"
  delegate_to: localhost

- name: Create directories for current year and month
  file:
    path: "{{ protokoll_basis }}/{{ current_year }}/{{ current_month }}/Serverpatch/Fertig/Linux"
    state: directory
  delegate_to: localhost

- name: Get package update information
  shell: "apt list --upgradable"
  register: update_info
  changed_when: false  # Markiere nicht als geändert, selbst wenn Updates verfügbar sind

- name: Write Linux patch log
  ansible.builtin.shell: |
    cat <<EOF >> {{ protokoll_basis }}/{{ ansible_facts['date_time']['year'] }}/{{ ansible_facts['date_time']['month'] }}/Serverpatch/Fertig/Linux/Updates-{{ inventory_hostname }}-Generated.txt
    ########################################## {{ current_time }} ##########################################
    Updates:
    {{ "-" + update_info.stdout | default("No updates available.") }}
    EOF
  delegate_to: localhost
  args:
    executable: /bin/bash
