---
# Frueher gab es hier zwei identische Plays: einen fuer 'localhost' (der
# Controller patchte sich selbst) und einen fuer linux_server. Unter Semaphore
# ist 'localhost' der Task-Container, nicht der Controller - der Play ist damit
# hinfaellig. Der bisherige Controller gehoert als normaler Host nach
# [linux_server] im Inventory.
- name: Patch Linux Server

  hosts: linux_server
  become: yes
  gather_facts: true

  tasks:
  - include_tasks: tasks/linux/write-log.yml
  - include_tasks: tasks/linux/dist-upgrade.yml

  - name: Check reboot
    ansible.builtin.stat:
      path: /var/run/reboot-required
    register: reboot_required_file

  - name: Reboot
    ansible.builtin.reboot:
    when: reboot_required_file.stat.exists

  - name: Autoremove
    ansible.builtin.apt:
      autoremove: true

  - name: Autoclean
    ansible.builtin.apt:
      autoclean: true
