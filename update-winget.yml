---
# Aktualisiert per winget installierte Programme auf Windows-Hosts und
# berichtet pro Paket, was anstand, was geklappt hat und was nicht.
#
# Standardmaessig wird nur gelistet (winget_dry_run: true). Erst mit
#   Extra-Var  winget_dry_run=false
# wird aktualisiert. Rebootet wird nie.
#
# Ablauf: 'winget upgrade' listet die anstehenden Pakete, danach wird jedes
# einzeln mit 'winget upgrade --id <id> --exact' aktualisiert. Das ergibt
# dasselbe wie '--all', aber mit einem Exit-Code pro Paket - und damit einem
# Erfolgsstatus, der nicht davon abhaengt, in welcher Sprache winget redet.
# Die Ergebnisse liegen strukturiert in winget_run.result.packages und sind
# die Grundlage fuer ein spaeteres Protokoll.
#
# Am Ende geht der Bericht aller Hosts per Mail raus, sofern mail_to gesetzt
# ist (zweites Play). Probleme brechen die Hosts deshalb nicht ab, sondern
# werden gesammelt - rot wird der Lauf erst nach dem Versand. Sonst kaeme
# die Mail ausgerechnet dann nicht, wenn etwas schiefgeht.
#
# Warum als SYSTEM: winget ist eine App-Paket-Anwendung (App Installer). In
# einer WinRM-Sitzung fehlt der Aufruf-Alias 'winget', und den Ordner unter
# C:\Program Files\WindowsApps darf nicht einmal ein Administrator auflisten.
# SYSTEM darf das - deshalb become SYSTEM und Aufruf ueber den vollen Pfad.
#
# Voraussetzungen am Zielhost:
#   - winget vorhanden: Windows 10/11 und Server 2025 ja, Server 2022 nur mit
#     nachinstalliertem App Installer, Server 2019 gar nicht
#   - Internetzugang. Als SYSTEM gelten die Proxy-Einstellungen angemeldeter
#     Benutzer nicht.
#
# Inventory: Hosts als FQDN eintragen (infra04.gutingia.local). WinRM laeuft
# ueber 'requests' und damit ueber den Proxy, sobald der Name nicht unter
# NO_PROXY faellt - ein Kurzname landet am Proxy statt am Server.

- name: Windows - winget upgrade
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  vars:
    winget_dry_run: true
    # Nur das Community-Repository. Die Store-Quelle braucht Store-Zugang
    # und scheitert auf Servern.
    winget_source: winget
    # Nachkontrolle: so lange wird nach den Updates hoechstens gewartet, bis
    # die aktualisierten Pakete aus der Liste verschwunden sind.
    winget_verify_seconds: 180
    # So lange wird auf den WinRM-Port gewartet, bevor ein Host als offline
    # gilt.
    winget_reach_timeout: 5

  tasks:
    # Fuer den Bericht im zweiten Play: welche Hosts dieser Lauf hatte,
    # auch die, die unterwegs scheitern oder nicht erreichbar sind.
    - name: Hosts dieses Laufs merken
      ansible.builtin.set_fact:
        winget_play_hosts: "{{ ansible_play_hosts_all }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    # Ausgeschaltete oder nicht mehr existierende Rechner sind beim Patchen
    # normal und kein Fehler. Ein kurzer Blick auf den WinRM-Port vorab
    # trennt sie sauber ab - ohne die langen Verbindungsfehler im Log, die
    # ein direkter WinRM-Versuch erzeugt.
    # Achtung: Bei delegate_to zeigen ansible_host und ansible_port auf den
    # delegierten Host (localhost) - deshalb ausdruecklich ueber hostvars.
    - name: Erreichbarkeit pruefen
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
        port: "{{ hostvars[inventory_hostname].ansible_port | default(5985) | int }}"
        timeout: "{{ winget_reach_timeout | int }}"
      delegate_to: localhost
      connection: local
      register: winget_reach
      failed_when: false
      when: (ansible_connection | default('ssh')) in ['winrm', 'psrp']

    # Offline nur bei genau diesem Timeout. Scheitert der Check aus einem
    # anderen Grund, wird winget trotzdem versucht - ein echter Fehler zeigt
    # sich dann dort, statt einen erreichbaren Host stumm zu ueberspringen.
    - name: Erreichbarkeit merken
      ansible.builtin.set_fact:
        winget_offline: "{{ 'Timeout when waiting' in (winget_reach.msg | default('')) }}"

    - name: Offline melden
      ansible.builtin.debug:
        msg: "offline - Port {{ ansible_port | default(5985) }} antwortet nicht (ausgeschaltet oder nicht im DNS)"
      when: winget_offline | bool

    - name: winget als SYSTEM aufrufen
      become: true
      become_method: runas
      become_user: SYSTEM
      ansible.windows.win_powershell:
        # Standard waere 2 - die Paketliste liegt tiefer und kaeme sonst als
        # Text statt als Struktur zurueck.
        depth: 5
        # Als Text statt als bool uebergeben: ein [bool]-Parameter in
        # PowerShell macht aus dem Text "False" ein $true.
        parameters:
          Mode: "{{ 'list' if (winget_dry_run | bool) else 'upgrade' }}"
          Source: "{{ winget_source }}"
          VerifySeconds: "{{ winget_verify_seconds | int }}"
        script: |
          [CmdletBinding()]
          param (
              [ValidateSet('list', 'upgrade')]
              [string]$Mode,
              [string]$Source,
              [int]$VerifySeconds
          )
          # Bewusst nicht 'Stop': PowerShell 5.1 bricht sonst bei der ersten
          # Zeile auf stderr eines externen Programms ab.
          $ErrorActionPreference = 'Continue'
          # Ohne Konsole (WinRM) kann das Setzen scheitern - dann eben ohne.
          try { [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 } catch { }

          # Neueste installierte Version suchen. Der Ordnername enthaelt sie:
          # Microsoft.DesktopAppInstaller_<version>_x64__8wekyb3d8bbwe
          $winget = Get-ChildItem -Path "$env:ProgramFiles\WindowsApps" -Directory `
                  -Filter 'Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe' -ErrorAction SilentlyContinue |
              Sort-Object { [version](($_.Name -split '_')[1]) } -Descending |
              ForEach-Object { Join-Path $_.FullName 'winget.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          if (-not $winget) {
              $Ansible.Result = @{ found = $false }
              return
          }

          # Erfolg ist nur Code 0, "nicht anwendbar" nur 0x8A15002B. Alles
          # andere ist ein Fehler - der Text hier ist nur ein Hinweis dazu.
          $hints = @{
              '0x8A150014' = 'kein passendes Paket gefunden'
              '0x8A15002B' = 'kein anwendbares Update'
              '0x8A150101' = 'Programm laeuft gerade'
              '0x8A150109' = 'Neustart noetig, um die Installation abzuschliessen'
              '0xC0000135' = 'DLL fehlt, meist die VC++-Laufzeit des App Installers'
          }
          $common = @('--source', $Source, '--accept-source-agreements', '--disable-interactivity')

          function Invoke-Winget {
              param ([string[]]$Arguments)
              $out = & $winget @Arguments 2>&1 | ForEach-Object { "$_" }
              $rc = $LASTEXITCODE
              # winget zeichnet Fortschritt per Wagenruecklauf neu - pro Zeile
              # zaehlt der letzte Stand. Spinner und Balken fliegen raus.
              $lines = $out |
                  ForEach-Object { $_ -split "`r" | Where-Object { $_.Trim() } | Select-Object -Last 1 } |
                  Where-Object { $_ -and $_ -notmatch '^\s*[-\\|/]\s*$' -and $_ -notmatch '[\u2580-\u259F]' } |
                  ForEach-Object { $_.TrimEnd() }
              [pscustomobject]@{
                  Rc    = $rc
                  Hex   = '0x{0:X8}' -f $rc
                  Lines = @(if ($lines) { $lines })
              }
          }

          # Liest die Tabelle von 'winget upgrade'. Die Spaltengrenzen kommen
          # aus den Positionen der Ueberschriften - deren Text ist je nach
          # Sprache verschieden, die Reihenfolge nicht: Name, Id, Version,
          # Verfuegbar und, nur ohne --source, Quelle. Was nach den
          # Datenzeilen kommt (Summe, Hinweise auf Pins usw.), wird als
          # Hinweis mitgegeben.
          function ConvertFrom-WingetTable {
              param ([string[]]$Lines)
              $none = [pscustomobject]@{ Parsed = $false; Rows = @(); Notes = @() }
              $sep = -1
              for ($i = 1; $i -lt $Lines.Count; $i++) {
                  if ($Lines[$i] -match '^-{10,}$') { $sep = $i; break }
              }
              if ($sep -lt 1) { return $none }
              $starts = @([regex]::Matches($Lines[$sep - 1], '\S+') | ForEach-Object { $_.Index })
              # Vier oder fuenf einwortige Ueberschriften erwartet. Alles
              # andere lieber gar nicht lesen als falsch - dann zeigt die
              # Rohausgabe, wie die Tabelle aussah.
              if ($starts.Count -notin 4, 5) { return $none }
              $rows = @()
              for ($i = $sep + 1; $i -lt $Lines.Count; $i++) {
                  $line = $Lines[$i]
                  # Datenzeile: reicht bis in die letzte Spalte, vor jeder
                  # Spaltengrenze steht ein Leerzeichen, und die Id ist ein
                  # einzelnes Wort. Die erste Zeile, auf die das nicht passt,
                  # ist die Summenzeile darunter.
                  if ($line.Length -le $starts[-1]) { break }
                  $aligned = $true
                  foreach ($s in $starts[1..($starts.Count - 1)]) {
                      if ($line[$s - 1] -ne ' ') { $aligned = $false }
                  }
                  if (-not $aligned) { break }
                  $cols = for ($c = 0; $c -lt $starts.Count; $c++) {
                      $from = if ($c -eq 0) { 0 } else { $starts[$c] }
                      $to = if ($c + 1 -lt $starts.Count) { $starts[$c + 1] } else { $line.Length }
                      $line.Substring($from, $to - $from).Trim()
                  }
                  if ($cols[1] -notmatch '^\S+$') { break }
                  $rows += [pscustomobject]@{
                      name      = $cols[0]
                      id        = $cols[1]
                      version   = $cols[2]
                      available = $cols[3]
                  }
              }
              # Achtung: $Lines[$i..($Lines.Count - 1)] liefe bei $i = Count
              # rueckwaerts und gaebe die letzte Zeile zurueck.
              $notes = @(if ($i -lt $Lines.Count) { $Lines[$i..($Lines.Count - 1)] | Where-Object { $_.Trim() } })
              [pscustomobject]@{ Parsed = $true; Rows = $rows; Notes = $notes }
          }

          # 0x8A150014 / 0x8A15002B: nichts gefunden bzw. nichts anwendbar -
          # beim Listen heisst das schlicht "alles aktuell".
          $listOkCodes = @('0x00000000', '0x8A150014', '0x8A15002B')

          function Get-UpgradeRows {
              param ([string[]]$Extra = @())
              $l = Invoke-Winget -Arguments (@('upgrade') + $Extra + $common)
              $ok = $l.Hex -in $listOkCodes
              $t = if ($ok) { ConvertFrom-WingetTable -Lines $l.Lines } else { $null }
              [pscustomobject]@{
                  Ok    = $ok
                  Hex   = $l.Hex
                  Lines = $l.Lines
                  Rows  = @(if ($t) { $t.Rows })
                  Notes = @(if ($t) { $t.Notes })
              }
          }

          $listing = Get-UpgradeRows
          $listingOk = $listing.Ok
          $rows = $listing.Rows
          # Den Hinweis auf Pins ersetzt der eigene Abschnitt weiter unten.
          # Erkannt wird er am Argument --include-pinned, das in jeder
          # Sprache gleich lautet.
          $notes = @($listing.Notes | Where-Object { $_ -notmatch '--include-pinned' })

          # Gepinnte Pakete laesst winget beim normalen Listen weg, mit
          # --include-pinned sind sie dabei - der Unterschied sind die Pins.
          # Angefasst werden sie nicht: ein Pin heisst "nur von Hand".
          $pinned = @()
          if ($listingOk) {
              $withPinned = Get-UpgradeRows -Extra @('--include-pinned')
              $normalIds = @($rows | ForEach-Object { $_.id })
              $pinned = @($withPinned.Rows | Where-Object { $_.id -notin $normalIds })
          }

          $packages = @(foreach ($row in $rows) {
              $entry = [ordered]@{
                  name      = $row.name
                  id        = $row.id
                  version   = $row.version
                  available = $row.available
                  status    = 'anstehend'
                  rc_hex    = $null
                  hint      = $null
                  output    = @()
              }
              if ($Mode -eq 'upgrade') {
                  if ($row.id -match '\u2026') {
                      # winget kuerzt zu lange Spalten mit einem Auslassungszeichen
                      $entry.status = 'uebersprungen'
                      $entry.hint = 'Id in der Liste abgeschnitten, nicht eindeutig'
                  } else {
                      $r = Invoke-Winget -Arguments (@('upgrade', '--id', $row.id, '--exact', '--silent', '--accept-package-agreements') + $common)
                      $entry.rc_hex = $r.Hex
                      $entry.hint = $hints[$r.Hex]
                      if ($r.Rc -eq 0) {
                          $entry.status = 'aktualisiert'
                      } elseif ($r.Hex -eq '0x8A15002B') {
                          $entry.status = 'nicht anwendbar'
                      } else {
                          $entry.status = 'fehlgeschlagen'
                          $entry.output = @($r.Lines | Select-Object -Last 5)
                      }
                  }
              }
              [pscustomobject]$entry
          })

          # Nachkontrolle: Manche Installer kehren sofort zurueck und
          # installieren im Hintergrund weiter. Deshalb erneut listen, bis die
          # aktualisierten Pakete verschwunden sind - hoechstens
          # $VerifySeconds lang. Was danach noch dasteht, ist "nicht
          # bestaetigt": entweder noch nicht fertig, oder winget erkennt die
          # neue Version nicht (das gibt es bei einzelnen Paketen dauerhaft).
          $updatedIds = @($packages | Where-Object { $_.status -eq 'aktualisiert' } | ForEach-Object { $_.id })
          if ($updatedIds.Count -gt 0) {
              $deadline = (Get-Date).AddSeconds($VerifySeconds)
              while ($true) {
                  $check = Get-UpgradeRows
                  # Scheitert schon das Listen, laesst sich nichts bestaetigen.
                  $left = @(if ($check.Ok) {
                      $stillIds = @($check.Rows | ForEach-Object { $_.id })
                      $updatedIds | Where-Object { $_ -in $stillIds }
                  } else { $updatedIds })
                  if ($left.Count -eq 0 -or (Get-Date) -ge $deadline) { break }
                  Start-Sleep -Seconds 20
              }
              foreach ($p in $packages) {
                  if ($p.id -in $left) {
                      $p.status = 'nicht bestaetigt'
                      $p.hint = 'winget meldet Erfolg, listet das Paket aber weiter'
                  }
              }
          }

          function Get-StatusCount {
              param ([string]$Status)
              @($packages | Where-Object { $_.status -eq $Status }).Count
          }
          $counts = [ordered]@{
              anstehend        = Get-StatusCount 'anstehend'
              aktualisiert     = Get-StatusCount 'aktualisiert'
              nicht_bestaetigt = Get-StatusCount 'nicht bestaetigt'
              fehlgeschlagen   = Get-StatusCount 'fehlgeschlagen'
              nicht_anwendbar  = Get-StatusCount 'nicht anwendbar'
              uebersprungen    = Get-StatusCount 'uebersprungen'
              gepinnt          = $pinned.Count
          }

          $tags = @{
              'anstehend'        = '[ANSTEHEND]'
              'aktualisiert'     = '[OK]'
              'nicht bestaetigt' = '[PRUEFEN]'
              'fehlgeschlagen'   = '[FEHLER]'
              'nicht anwendbar'  = '[N/A]'
              'uebersprungen'    = '[SKIP]'
          }
          $report = @()
          if ($Mode -eq 'list') {
              $report += '{0} Update(s) anstehend, {1} gepinnt - nur gelistet, nichts installiert' -f `
                  $packages.Count, $pinned.Count
          } else {
              $report += ('aktualisiert: {0} | nicht bestaetigt: {1} | fehlgeschlagen: {2} | ' +
                          'nicht anwendbar: {3} | uebersprungen: {4} | gepinnt: {5}') -f `
                  $counts.aktualisiert, $counts.nicht_bestaetigt, $counts.fehlgeschlagen,
                  $counts.nicht_anwendbar, $counts.uebersprungen, $counts.gepinnt
          }
          foreach ($p in $packages) {
              $line = '{0,-12} {1,-40} {2} -> {3}' -f $tags[$p.status], $p.id, $p.version, $p.available
              if ($p.rc_hex -and $p.status -notin 'aktualisiert', 'nicht bestaetigt') { $line += '  ' + $p.rc_hex }
              if ($p.hint) { $line += '  ' + $p.hint }
              $report += $line
          }
          if ($pinned.Count -gt 0) {
              $report += 'Gepinnt - werden nur von Hand aktualisiert:'
              foreach ($p in $pinned) {
                  $report += '{0,-12} {1,-40} {2} -> {3}' -f '[GEPINNT]', $p.id, $p.version, $p.available
              }
          }
          foreach ($n in $notes) { $report += 'Hinweis von winget: ' + $n.Trim() }

          $Ansible.Result = @{
              found      = $true
              winget     = $winget
              mode       = $Mode
              listing_ok = $listingOk
              listing_rc = $listing.Hex
              packages   = $packages
              pinned     = $pinned
              notes      = $notes
              counts     = $counts
              report     = $report
              raw        = $listing.Lines
          }
          $Ansible.Changed = $counts.aktualisiert -gt 0
      register: winget_run
      when:
        - (ansible_connection | default('ssh')) in ['winrm', 'psrp']
        - not (winget_offline | bool)
      # Fehler und Unerreichbarkeit werden unten zu einem Problem pro Host.
      # So laeuft jeder Host bis zum Bericht durch.
      ignore_errors: true
      ignore_unreachable: true

    # Leerer Text = kein Problem. Die Reihenfolge entspricht der Frage
    # "wo ist es zuerst schiefgegangen".
    - name: Probleme festhalten
      ansible.builtin.set_fact:
        # Eine Vorlage ganz ohne Ausgabe ergibt seit ansible-core 2.19 None
        # statt eines leeren Texts - deshalb der Umweg ueber default('', true).
        winget_problem: "{{ winget_problem_text | default('', true) | trim }}"
      vars:
        winget_problem_text: >-
          {%- if winget_offline | bool -%}
          {%- elif (ansible_connection | default('ssh')) not in ['winrm', 'psrp'] -%}
          kein Windows-Host (ansible_connection={{ ansible_connection | default('ssh') }}) -
          im Inventory ansible_connection=winrm setzen
          {%- elif winget_run.unreachable | default(false) -%}
          nicht erreichbar: {{ winget_run.msg | default('') }}
          {%- elif winget_run.failed | default(false) -%}
          winget-Aufruf gescheitert: {{ winget_run.msg | default('') }}
          {%- elif not (winget_run.result.found | default(false)) -%}
          winget nicht installiert - Server 2022 braucht den App Installer
          von Hand, Server 2019 kann winget gar nicht
          {%- elif not (winget_run.result.listing_ok | default(false)) -%}
          winget konnte die Liste nicht abrufen (Code
          {{ winget_run.result.listing_rc | default('?') }})
          {%- if winget_run.result.listing_rc | default('') == '0xC0000135' -%}
          {{ ' ' }}- winget startet nicht, es fehlt eine DLL (meist die
          VC++-Laufzeit des App Installers)
          {%- endif -%}
          {%- elif (winget_run.result.counts.fehlgeschlagen | default(0) | int) > 0 -%}
          {{ winget_run.result.counts.fehlgeschlagen }} Update(s) fehlgeschlagen
          {%- endif -%}

    - name: Problem anzeigen
      ansible.builtin.debug:
        msg: "PROBLEM: {{ winget_problem }}"
      when: winget_problem | length > 0

    - name: Bericht
      ansible.builtin.debug:
        var: winget_run.result.report
      when: winget_run.result.report is defined

    # Leere Liste kann "alles aktuell" heissen oder eine Tabelle, die nicht
    # erkannt wurde - die Rohausgabe zeigt, welches von beiden.
    - name: Rohausgabe der Liste, wenn keine Pakete erkannt wurden
      ansible.builtin.debug:
        var: winget_run.result.raw
      when:
        - winget_run.result.raw is defined
        - winget_run.result.packages | default([]) | length == 0

    - name: Ausgabe der fehlgeschlagenen Updates
      ansible.builtin.debug:
        msg: "{{ item.output }}"
      loop: "{{ winget_run.result.packages | default([]) | selectattr('status', 'equalto', 'fehlgeschlagen') | list }}"
      loop_control:
        label: "{{ item.id }}"


# Zweites Play: Bericht aller Hosts einsammeln, per Mail verschicken und erst
# dann den Lauf scheitern lassen, wenn es irgendwo ein Problem gab.
#
# Mail geht nur raus, wenn mail_to gesetzt ist. Am bequemsten als
# Variablengruppe in Semaphore (Extra-Variablen):
#   {"mail_host": "smtp.example.local", "mail_to": "it@example.de",
#    "mail_from": "semaphore@example.de"}
# Optional: mail_port (25), mail_secure (try), mail_username, mail_password.
# Ohne mail_from ist der Empfaenger zugleich Absender - das nehmen interne
# Relays meist an.
- name: Bericht verschicken
  hosts: localhost
  gather_facts: false

  vars:
    winget_hosts: "{{ winget_play_hosts | default([]) }}"

  tasks:
    - name: Ergebnisse aller Hosts einsammeln
      ansible.builtin.set_fact:
        winget_results: >-
          {{ winget_results | default([]) + [{
               'host': item,
               'problem': hostvars[item].winget_problem
                          if hostvars[item].winget_problem is defined
                          else 'kein Ergebnis - Host hat den Lauf nicht erreicht',
               'offline': hostvars[item].winget_offline | default(false) | bool,
               'mode': hostvars[item].winget_run.result.mode | default('-'),
               'counts': hostvars[item].winget_run.result.counts | default({}),
               'report': hostvars[item].winget_run.result.report | default([])
             }] }}
      loop: "{{ winget_hosts }}"

    - name: Betreff und Text zusammenstellen
      ansible.builtin.set_fact:
        winget_mail_subject: >-
          {%- set results = winget_results | default([]) -%}
          {%- set counts = results | map(attribute='counts') | list -%}
          {%- set ok = counts | map(attribute='aktualisiert', default=0) | map('int') | sum -%}
          {%- set failed = counts | map(attribute='fehlgeschlagen', default=0) | map('int') | sum -%}
          {%- set pending = counts | map(attribute='anstehend', default=0) | map('int') | sum -%}
          {%- set unconfirmed = counts | map(attribute='nicht_bestaetigt', default=0) | map('int') | sum -%}
          {%- set pinned = counts | map(attribute='gepinnt', default=0) | map('int') | sum -%}
          {%- set problems = results | selectattr('problem') | list | length -%}
          {%- set offline = results | selectattr('offline') | list | length -%}
          {%- set totals = [
                ((ok ~ ' aktualisiert') if ok else ''),
                ((unconfirmed ~ ' nicht bestaetigt') if unconfirmed else ''),
                ((failed ~ ' fehlgeschlagen') if failed else ''),
                ((pending ~ ' anstehend') if pending else ''),
                ((pinned ~ ' gepinnt') if pinned else ''),
                ((offline ~ ' offline') if offline else '')
              ] | select | join(', ') -%}
          {%- if results | length == 0 -%}
          [winget] kein Host getroffen - Inventory pruefen
          {%- else -%}
          [winget] {{ results | length }} Host(s): {{ totals or 'nichts anstehend' }}
          {%- if problems %} - {{ problems }} mit Problem{% endif -%}
          {%- endif -%}
        winget_mail_body: |
          winget-Bericht aus Semaphore
          {% for r in winget_results | default([]) | rejectattr('offline') %}

          === {{ r.host }} ({{ {'list': 'nur Liste', 'upgrade': 'Aktualisierung'}[r.mode] | default('kein Lauf') }}) ===
          {% if r.problem %}
          PROBLEM: {{ r.problem }}
          {% endif %}
          {% for line in r.report %}
          {{ line }}
          {% endfor %}
          {% endfor %}
          {% set offline_hosts = winget_results | default([]) | selectattr('offline') | map(attribute='host') | list %}
          {% if offline_hosts %}

          === Offline ({{ offline_hosts | length }}) - ausgeschaltet oder nicht im DNS ===
          {% for h in offline_hosts %}
            - {{ h }}
          {% endfor %}
          {% endif %}

    - name: Betreff anzeigen
      ansible.builtin.debug:
        msg: "{{ winget_mail_subject }}"

    - name: Mail-Einstellungen pruefen
      ansible.builtin.assert:
        that: mail_host is defined
        fail_msg: mail_to ist gesetzt, aber mail_host fehlt.
        quiet: true
      when: mail_to is defined

    - name: Bericht per Mail verschicken
      community.general.mail:
        host: "{{ mail_host }}"
        port: "{{ mail_port | default(25) | int }}"
        secure: "{{ mail_secure | default('try') }}"
        username: "{{ mail_username | default(omit) }}"
        password: "{{ mail_password | default(omit) }}"
        sender: "{{ mail_from | default(mail_to) }}"
        to: "{{ mail_to }}"
        subject: "{{ winget_mail_subject }}"
        body: "{{ winget_mail_body }}"
        charset: utf-8
      when: mail_to is defined

    - name: Hinweis, wenn keine Mail verschickt wurde
      ansible.builtin.debug:
        msg: Keine Mail - mail_to ist nicht gesetzt.
      when: mail_to is not defined

    - name: Lauf scheitern lassen, wenn kein Host getroffen wurde
      ansible.builtin.fail:
        msg: >-
          Das Muster '{{ target_hosts | default('all') }}' hat keinen Host
          getroffen - Inventory oder target_hosts pruefen.
      when: winget_hosts | length == 0

    - name: Lauf scheitern lassen, wenn es Probleme gab
      ansible.builtin.fail:
        msg: >-
          Probleme auf {{ problem_hosts | join(', ') }} - Einzelheiten im
          Bericht darueber und in der Mail.
      vars:
        problem_hosts: "{{ winget_results | default([]) | selectattr('problem') | map(attribute='host') | list }}"
      when: problem_hosts | length > 0
