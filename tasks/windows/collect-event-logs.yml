---
# Kritische Ereignisse, Fehler und Warnungen aus Application und System im
# Patchzeitraum abfragen. Die bekannten, unwichtigen Event-IDs werden ausgeschlossen.
#
# Eingabe:  winupd_log_start_utc, winupd_log_end_utc (UTC, ISO 8601)
# Ergebnis: winupd_event_logs mit Anzahlen und Meldungen nach Schweregrad

- name: Ereignisprotokolle im Patchzeitraum abfragen
  ansible.windows.win_powershell:
    depth: 5
    parameters:
      StartUtc: "{{ winupd_log_start_utc }}"
      EndUtc: "{{ winupd_log_end_utc }}"
    script: |
      param ([string]$StartUtc, [string]$EndUtc)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $culture = [Globalization.CultureInfo]::InvariantCulture
      $start = [DateTimeOffset]::Parse($StartUtc, $culture).UtcDateTime
      $end = [DateTimeOffset]::Parse($EndUtc, $culture).UtcDateTime
      $startIso = $start.ToString("yyyy-MM-dd'T'HH:mm:ss.fff'Z'", $culture)
      $endIso = $end.ToString("yyyy-MM-dd'T'HH:mm:ss.fff'Z'", $culture)
      $excluded = @{
          Application = @(0, 17137, 4098, 34, 904, 547, 35, 44, 194, 389, 91, 247, 1000, 1003, 1008, 16384, 16394, 56052, 56082)
          System      = @(1801, 10010, 10016, 10028, 7036, 15021)
      }
      $results = @{
          Application = @{ critical = 0; warning = 0; error = 0; events = @() }
          System      = @{ critical = 0; warning = 0; error = 0; events = @() }
      }
      $errors = @()
      foreach ($logName in @('Application', 'System')) {
          $xmlText = '<QueryList><Query Id="0" Path="{0}"><Select Path="{0}"></Select><Suppress Path="{0}"></Suppress></Query></QueryList>' -f $logName
          [xml]$query = $xmlText
          $select = $query.SelectSingleNode('/QueryList/Query/Select')
          $suppress = $query.SelectSingleNode('/QueryList/Query/Suppress')
          $select.InnerText = "*[System[TimeCreated[@SystemTime>='$startIso' and @SystemTime<='$endIso'] and (Level=1 or Level=2 or Level=3)]]"
          $excludeExpression = ($excluded[$logName] | ForEach-Object { "EventID=$_ " }) -join 'or '
          $suppress.InnerText = "*[System[($excludeExpression)]]"
          try {
              $events = @(Get-WinEvent -FilterXml $query -ErrorAction Stop)
              foreach ($event in ($events | Sort-Object TimeCreated)) {
                  $severity = switch ($event.Level) {
                      1 { 'critical' }
                      2 { 'error' }
                      3 { 'warning' }
                  }
                  if ($severity) {
                      $results[$logName][$severity]++
                      $message = ([string]$event.Message -replace '\s+', ' ').Trim()
                      $results[$logName].events += @{
                          level    = $severity.ToUpperInvariant()
                          provider = [string]$event.ProviderName
                          message  = $message
                      }
                  }
              }
          }
          catch {
              if ($_.FullyQualifiedErrorId -notmatch 'NoMatchingEventsFound') {
                  $errors += "$logName`: $($_.Exception.Message)"
              }
          }
      }
      $Ansible.Result = @{
          start_utc  = $startIso
          end_utc    = $endIso
          application = $results.Application
          system      = $results.System
          errors      = @($errors)
      }
  register: winupd_event_logs_raw

- name: Ereignisprotokolle merken
  ansible.builtin.set_fact:
    winupd_event_logs: "{{ winupd_event_logs_raw.result }}"
